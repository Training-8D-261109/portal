<html lang="ru">

<meta charset="utf-8">

<style>
/* Layout: шапка проекта как в Ганте → панель видов и фильтров → рабочая область (таблица / матрица / вовлечённость / фазы) → легенда; карточка стейкхолдера выезжает справа */
:root{
  --page:#e9f0f8; --page-line:#d3deeb; --bg:#ffffff; --surface:#f6f7fa; --surface-2:#eef0f5; --line:#e3e6ee; --line-strong:#cdd2de;
  --ink:#1b2130; --ink-2:#596173; --ink-3:#8b92a3;
  --accent:#3b5bdb; --accent-soft:#e8edfc; --sel:#e6eaf5;
  --warn:#b0611a; --warn-soft:#fbeee0; --crit:#c23a3a; --crit-soft:#fbe7e7;
  --ok:#2c8553; --ok-soft:#e2f2e8; --mute-soft:#eceef3;
  --shadow:0 12px 40px rgba(20,28,48,.16);
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0e1726; --page-line:#25344b; --bg:#141a24; --surface:#181c25; --surface-2:#1f2430; --line:#2a303c; --line-strong:#3a4252;
  --ink:#e6e9f0; --ink-2:#a3abbc; --ink-3:#727a8c;
  --accent:#86a0ff; --accent-soft:#222b47; --sel:#252c3c;
  --warn:#e4a062; --warn-soft:#3a2a1a; --crit:#ef8080; --crit-soft:#3b2125;
  --ok:#62c48f; --ok-soft:#1b3326; --mute-soft:#232835;
  --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#0e1726; --page-line:#25344b; --bg:#141a24; --surface:#181c25; --surface-2:#1f2430; --line:#2a303c; --line-strong:#3a4252;
  --ink:#e6e9f0; --ink-2:#a3abbc; --ink-3:#727a8c;
  --accent:#86a0ff; --accent-soft:#222b47; --sel:#252c3c;
  --warn:#e4a062; --warn-soft:#3a2a1a; --crit:#ef8080; --crit-soft:#3b2125;
  --ok:#62c48f; --ok-soft:#1b3326; --mute-soft:#232835;
  --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 28px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Шапка */
.head{display:flex;gap:16px;align-items:center}
.logo{width:64px;height:64px;flex:none;border-radius:14px;background:url(data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTQiIGZpbGw9IiMxZjVmNDUiLz48cGF0aCBkPSJNMTAgMzZjNC05IDEwLTEzIDE0LTEzIDMgMCA0IDMgNiAzczMtMyA2LTNjNCAwIDEwIDQgMTggMTMiIGZpbGw9IiM3ZmM3OWEiLz48Y2lyY2xlIGN4PSIyNCIgY3k9IjI3IiByPSIyLjYiIGZpbGw9IiMxMzI0MWIiLz48Y2lyY2xlIGN4PSIzNiIgY3k9IjI3IiByPSIyLjYiIGZpbGw9IiMxMzI0MWIiLz48cGF0aCBkPSJNNiAzOGM0IDAgNCAzIDggM3M0LTMgOC0zIDQgMyA4IDMgNC0zIDgtMyA0IDMgOCAzIDQtMyA4LTMgNCAzIDQgM3Y5SDZ6IiBmaWxsPSIjM2I4ZmM5Ii8+PHBhdGggZD0iTTYgNDZjNCAwIDQgMyA4IDNzNC0zIDgtMyA0IDMgOCAzIDQtMyA4LTMgNCAzIDggMyA0LTMgOC0zIDQgMyA0IDMiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2E5ZDZmMiIgc3Ryb2tlLXdpZHRoPSIyIiBzdHJva2UtbGluZWNhcD0icm91bmQiLz48L3N2Zz4K) center/contain no-repeat}
:root[data-theme="dark"] .head-main{min-width:0}
.eyebrow{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.eyebrow svg{width:12px;height:12px;fill:currentColor}
.doctype{margin-left:6px;padding:2px 8px;border-radius:5px;background:var(--accent);color:var(--bg);letter-spacing:.06em}
h1{margin:2px 0 4px;font-size:clamp(19px,2.6vw,26px);line-height:1.2;font-weight:700;text-wrap:balance}
.facts{display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--ink-2);font-size:13.5px}
.facts b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.facts .w{color:var(--warn)} .facts .w b{color:var(--warn)}

/* Панель управления */
.bar{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;margin-top:16px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;background:var(--bg)}
.seg button{border:0;background:none;padding:7px 14px;cursor:pointer;color:var(--ink-2);border-right:1px solid var(--line);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--surface)}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--ink);font-weight:600}
.field{display:flex;align-items:center;gap:8px;color:var(--ink-2)}
.inp{border:1px solid var(--line-strong);border-radius:8px;background:var(--bg);padding:7px 10px;min-width:0}
#q{width:220px;max-width:100%}
.chk{display:inline-flex;align-items:center;gap:7px;cursor:pointer;color:var(--ink)}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.btn{border:1px solid var(--line-strong);border-radius:8px;background:var(--bg);padding:7px 12px;cursor:pointer}
.btn:hover{background:var(--surface)}

.work{margin-top:14px;background:var(--bg);border:1px solid var(--page-line);border-radius:10px;padding:2px 14px 14px;overflow:hidden}
.note{color:var(--ink-2);font-size:13px;margin:12px 0 0;max-width:80ch}

/* Таблица реестра */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1440px}
.nx{font-size:12.5px;max-width:26ch}
.nx .dd{font-family:var(--f-mono);font-weight:700;margin-right:5px}
.nx.soon .dd{color:var(--warn)}
.nx.none{color:var(--ink-3)}
.ctc{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:6px}
.ctc .who{font-weight:600}
.ctc .mail{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctc .mail .mono{user-select:all}
.copy{border:1px solid var(--line-strong);background:var(--bg);border-radius:6px;padding:2px 8px;font-size:12px;cursor:pointer}
.fict{font-size:11.5px;color:var(--ink-3)}
th{position:sticky;top:0;z-index:2;background:var(--bg);text-align:left;font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);padding:10px 8px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
th[data-k]{cursor:pointer;user-select:none}
th[data-k]:hover{color:var(--ink)}
th .ar{opacity:.35;margin-left:3px} th.on .ar{opacity:1;color:var(--accent)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr.row{cursor:pointer}
tbody tr.row:hover td{background:var(--surface)}
tbody tr.row.cur td{background:var(--accent-soft)}
tr.grp td{background:var(--surface-2);font-weight:700;padding:8px;cursor:pointer;user-select:none}
tr.grp .cnt{color:var(--ink-3);font-weight:500;margin-left:6px}
tr.grp .chev{display:inline-block;width:14px;transition:transform .15s;color:var(--ink-2)}
tr.grp.closed .chev{transform:rotate(-90deg)}
.id{color:var(--ink-3);font-size:12.5px;white-space:nowrap}
.nm{font-weight:600}
.sub{color:var(--ink-2);font-size:12.5px;margin-top:2px;max-width:42ch}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:5px;background:var(--mute-soft);color:var(--ink-2);white-space:nowrap}
.tag.cr{font-family:var(--f-mono);background:var(--warn-soft);color:var(--warn)}
.tag.ind{background:none;border:1px dashed var(--line-strong)}
.role{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:5px;white-space:nowrap;background:var(--surface-2);color:var(--ink);border:1px solid var(--line-strong)}
.role.r-sponsor{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.role.r-customer{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.role.r-pm{background:var(--ok);color:var(--bg);border-color:var(--ok)}
.keyroles{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:10px}
.keyroles .lbl{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.kr{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--page-line);background:var(--bg);border-radius:8px;padding:4px 10px 4px 4px;cursor:pointer}
.kr:hover{border-color:var(--accent)}
.kr b{font-weight:600}
.meter{display:inline-flex;gap:3px;align-items:center;vertical-align:middle}
.meter i{width:7px;height:12px;border-radius:2px;background:var(--line)}
.meter i.f{background:var(--ink)}
.meter.hi i.f{background:var(--accent)}
.num{font-family:var(--f-mono);font-size:12.5px;margin-left:6px;color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-manage{background:var(--crit-soft);color:var(--crit)}
.s-satisfy{background:var(--warn-soft);color:var(--warn)}
.s-inform{background:var(--accent-soft);color:var(--accent)}
.s-monitor{background:var(--mute-soft);color:var(--ink-2)}
.eng{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;white-space:nowrap}
.eng .gap{color:var(--warn);font-weight:600}
.eng .eq{color:var(--ok)}
.warn-dot{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--warn);color:var(--bg);font-size:11px;font-weight:800;margin-left:6px;vertical-align:1px}
.small{font-size:12.5px;color:var(--ink-2)}

/* Матрица */
.mx-wrap{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px;margin-top:14px}
.mx-scroll{overflow-x:auto}
.mx{display:grid;grid-template-columns:28px repeat(5,minmax(118px,1fr));grid-template-rows:repeat(5,minmax(84px,auto)) 30px;min-width:640px}
.mx .yl,.mx .xl{display:grid;place-items:center;color:var(--ink-3);font-family:var(--f-mono);font-size:12px}
.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:4px;position:relative}
.cell.q-manage{background:color-mix(in srgb,var(--crit-soft) 70%,var(--bg))}
.cell.q-satisfy{background:color-mix(in srgb,var(--warn-soft) 60%,var(--bg))}
.cell.q-inform{background:color-mix(in srgb,var(--accent-soft) 60%,var(--bg))}
.cell.q-monitor{background:var(--bg)}
.cell.top{border-top:1px solid var(--line)} .cell.left{border-left:1px solid var(--line)}
.cell.splitx{border-left:2px solid var(--line-strong)} .cell.splity{border-bottom:2px solid var(--line-strong)}
.qlabel{position:absolute;right:6px;bottom:4px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.75;pointer-events:none}
.chip{border:1px solid var(--line-strong);background:var(--bg);border-radius:6px;padding:2px 7px;font-size:12px;cursor:pointer;line-height:1.35;max-width:100%;text-align:left}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip .mono{color:var(--ink-3);font-size:10.5px;margin-right:4px}
.chip.moved{border-style:dashed;border-color:var(--warn);color:var(--warn)}
.chip.ghost{opacity:.35}
.chip.cur{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.chip.cur .mono{color:inherit}
.axis-y{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.side h3{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2)}
.side p{margin:0 0 10px;color:var(--ink-2);font-size:13px}
.qlist{display:grid;gap:8px;margin-bottom:16px}
.qrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.qrow b{font-variant-numeric:tabular-nums}

/* Вовлечённость */
.seam{min-width:860px}
.seam th.lv,.seam td.lv{text-align:center;width:13%}
.seam td.lv{position:relative;padding:9px 4px}
.mark{display:inline-grid;place-items:center;width:24px;height:22px;border-radius:5px;font-weight:700;font-size:12px;position:relative;z-index:1}
.mark.c{background:var(--ink);color:var(--bg)}
.mark.d{border:2px solid var(--accent);color:var(--accent);background:var(--bg)}
.mark.cd{background:var(--ok);color:var(--bg)}
.track{position:absolute;top:50%;height:2px;background:var(--warn);z-index:0}

/* Фазы */
.ph{min-width:900px}
.ph th.p,.ph td.p{text-align:center;width:12%}
.ph th.p small{display:block;font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink-3)}
.ph th.p.now{color:var(--accent)}
.ph td.p{padding:6px}
.heat{height:22px;border-radius:4px}
.h0{background:transparent;border:1px dashed var(--line)}
.h1{background:color-mix(in srgb,var(--accent) 18%,var(--bg))}
.h2{background:color-mix(in srgb,var(--accent) 48%,var(--bg))}
.h3{background:var(--accent)}
.ph td.p.now{background:color-mix(in srgb,var(--warn-soft) 55%,transparent)}
.ph td.p.done .heat{opacity:.5}

/* Легенда */
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;margin-top:12px;padding-top:4px;color:var(--ink-2);font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend .fine{margin-left:auto;color:var(--ink-3);font-size:12.5px}

/* Карточка */
.scrim{position:fixed;inset:0;background:rgba(10,14,24,.28);z-index:20}
.card{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--bg);border-left:1px solid var(--line-strong);box-shadow:var(--shadow);z-index:21;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.card-h{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.card-h .t{min-width:0;flex:1}
.card-h h2{margin:2px 0 6px;font-size:19px;line-height:1.25;text-wrap:balance}
.x{border:1px solid var(--line-strong);background:var(--bg);border-radius:8px;width:34px;height:34px;cursor:pointer;flex:none;font-size:18px;line-height:1}
.card-b{overflow-y:auto;padding:14px 18px 22px;display:grid;gap:16px}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:7px 12px;font-size:13.5px}
.kv dt{color:var(--ink-2)} .kv dd{margin:0}
.sec h4{margin:0 0 6px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.sec p{margin:0}
.crl{display:grid;gap:8px}
.cri{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
.cri .top{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:3px}
.st{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:5px}
.st-ok{background:var(--ok-soft);color:var(--ok)} .st-no{background:var(--crit-soft);color:var(--crit)}
.st-wait{background:var(--warn-soft);color:var(--warn)} .st-def{background:var(--mute-soft);color:var(--ink-2)}
.risk{background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:9px 11px;font-size:13.5px}
.risk b{color:var(--warn)}
.qst{border:1px dashed var(--accent);border-radius:8px;padding:9px 11px;font-size:13.5px}
.qst b{color:var(--accent)}
.mini-ph{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.mini-ph div{text-align:center;font-size:11px;color:var(--ink-3)}
.mini-ph .heat{height:16px;margin-bottom:3px}

@media (max-width:820px){
  .mx-wrap{grid-template-columns:minmax(0,1fr)}
  .legend .fine{margin-left:0}
  #q{width:100%}
  .bar .field.grow{flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.sx{display:flex;align-items:center;gap:4px;flex-wrap:wrap}.sxa{color:var(--ink-3);font-weight:600}
.sxn{display:inline-block;margin-top:4px;font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:4px}
.sxn.red{color:var(--crit);background:var(--crit-soft)}.sxn.amber{color:var(--warn);background:var(--warn-soft)}.sxn.ok{color:var(--ink-2);background:var(--mute-soft)}
.chip.sg-red{box-shadow:inset 0 0 0 2px var(--crit)}.chip.sg-amber{box-shadow:inset 0 0 0 2px var(--warn)}
[hidden]{display:none!important}
.ctl{display:grid;gap:2px;font-size:12.5px;min-width:24ch;white-space:nowrap}.ctl .ci{display:inline-block;width:18px;color:var(--ink-3)}
.req{font-size:12.5px;line-height:1.4;padding:5px 8px;border-left:3px solid var(--crit);background:var(--crit-soft);border-radius:0 5px 5px 0;min-width:26ch;max-width:34ch}
.req.big{font-size:14px;max-width:none}
.mail .cl{display:inline-block;min-width:92px;color:var(--ink-3);font-size:12.5px}

body{margin:0}
.who-c{display:flex;align-items:flex-start;gap:10px;min-width:230px}
.ava{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;background:var(--surface-2);box-shadow:0 0 0 1px var(--line)}
.ava.none{display:grid;place-items:center;font-size:11.5px;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
.ava.big{width:72px;height:72px;font-size:20px}
.card-h{display:flex;gap:14px;align-items:flex-start}.card-h .t{flex:1;min-width:0}
.role.r-gov{background:var(--mute-soft);color:var(--ink-2)}
</style>
</head>
<body>
<km-shell page="sh" bleed></km-shell>
<header class="head">
  <div class="logo" role="img" aria-label="Логотип фермы «Тёплый Нил»"></div>
  <div class="head-main">
    <div class="eyebrow"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 7V5a4 4 0 1 1 8 0v2h1v8H3V7h1zm2 0h4V5a2 2 0 1 0-4 0v2z"/></svg>Собственность ООО «Тёплый Нил» · Для внутреннего пользования<span class="doctype">Реестр стейкхолдеров</span></div>
    <h1>Реестр стейкхолдеров · «КрокоМетрика: MVP аппаратно-программного комплекса для крокодиловой фермы»</h1>
    <div class="facts" id="facts"></div>
  </div>
</header>

<div class="bar" role="toolbar" aria-label="Виды и фильтры">
  <div class="seg" id="views">
    <button type="button" data-v="registry">Реестр</button>
    <button type="button" data-v="matrix">Матрица</button>
    <button type="button" data-v="engagement">Вовлечённость</button>
    <button type="button" data-v="phases">По фазам</button>
  </div>
  <div class="seg" id="side">
    <button type="button" data-s="all">Все</button>
    <button type="button" data-s="in">Внутренние</button>
    <button type="button" data-s="out">Внешние</button>
  </div>
  <label class="field grow"><input class="inp" id="q" type="search" placeholder="Поиск: имя, роль, контакт, требование…" autocomplete="off"></label>
  <label class="field"><select class="inp" id="role" aria-label="Роль на проекте"></select></label>
  <label class="field"><select class="inp" id="cat" aria-label="Категория"></select></label>
  <label class="chk"><input type="checkbox" id="gaponly"> Только с разрывом вовлечённости</label>
  <label class="chk" id="futwrap" hidden><input type="checkbox" id="future"> Прогноз: старт кампании</label>
</div>

<main class="work" id="work"></main>

<footer class="legend" id="legend"></footer>

<div class="scrim" id="scrim" hidden></div>
<aside class="card" id="card" hidden aria-label="Карточка стейкхолдера"></aside>

<script src="data/project.js" charset="utf-8"></script>
<script src="data/stakeholders.js" charset="utf-8"></script>
<script src="js/dates.js" charset="utf-8"></script>
<script src="js/shell.js" charset="utf-8"></script>
<script>
const {PROJECT,LEVELS,LV_SHORT,STRAT,PHASES,CR,CATS,S,ROLES,RL,RI,RMAP,rbadge,hi,strat,quad,asis,SRANK,sgap}=KM_SH;
const st={view:"registry",side:"all",q:"",cat:-1,role:"",gap:false,future:false,sort:null,dir:1,closed:new Set(),open:null};
try{const v=localStorage.getItem("km-sr-closed");if(v)JSON.parse(v).forEach(x=>st.closed.add(x))}catch(e){}

const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function list(){const q=st.q.trim().toLowerCase();
  return S.filter(s=>(st.side==="all"||(st.side==="in"?s.in:!s.in))&&(st.cat<0||s.cat===st.cat)&&(!st.role||s.rk===st.role)&&(!st.gap||s.c!==s.d)&&
   (!q||[s.id,s.name,s.role,s.want,s.own,s.cr.join(" "),s.wbs.join(" "),CATS[s.cat],RL[s.rk],s.nx?s.nx.d+" "+s.nx.t:"",s.ct?[s.ct.n,s.ct.pos,s.ct.mail,s.ct.tg,s.ct.tel].join(" "):"",s.req||""].join(" ").toLowerCase().includes(q)));}

function facts(){const n=S.length,inn=S.filter(s=>s.in).length,man=S.filter(s=>strat(s)==="manage").length,
  gap=S.filter(s=>s.c!==s.d).length,risk=S.filter(s=>s.p>=4&&s.c<=2&&s.d>s.c).length;
  $("#facts").innerHTML=`<span>Стейкхолдеров <b>${n}</b></span><span>Внутренних <b>${inn}</b> · внешних <b>${n-inn}</b></span>
  <span title="Управляющий партнёр АО «ЭкзоАгро»">Спонсор <b>Марк Волынский</b></span><span title="Генеральный директор фермы">Заказчик <b>Сергей Калинин</b></span><span>Статус <b>старт проекта · устав утверждён</b></span><span>Manage closely <b>${man}</b></span>
  <span class="w">Разрыв вовлечённости: <b>${gap}</b></span><span class="w">Влияние ≥4 без поддержки: <b>${risk}</b></span>`;}

const ini=s=>s.name.replace(/[«»"()]/g,"").split(/\s+/).filter(w=>/^[А-ЯЁA-Z]/.test(w)).slice(0,2).map(w=>w[0]).join("")||s.name[0];
const ava=(s,big)=>s.photo?`<img class="ava${big?" big":""}" src="${s.photo}" alt="" loading="lazy">`:`<span class="ava${big?" big":""} none" aria-hidden="true">${ini(s)}</span>`;
function meter(v){let h="";for(let k=1;k<=5;k++)h+=`<i class="${k<=v?"f":""}"></i>`;return`<span class="meter ${v>=4?"hi":""}" aria-label="${v} из 5">${h}</span><span class="num">${v}</span>`;}
const pill=k=>`<span class="pill s-${k}">${STRAT[k]}</span>`;
/* «сейчас → нужно»: одна плашка, если совпадает; стрелка и пометка, если нет */
const GAPTXT={ok:"исключение принято",red:"работаем слабее, чем нужно",amber:""};
function stratCell(s){const g=sgap(s),n=strat(s),a=asis(s);if(g==="none")return pill(n);
  const t=g==="ok"?GAPTXT.ok:SRANK[a]>SRANK[n]?"тратим больше, чем нужно":"работаем слабее, чем нужно";
  return `<div class="sx">${pill(a)}<span class="sxa">→</span>${pill(n)}</div><div class="sxn ${g}">${t}</div>`;}
function eng(s){return s.c===s.d?`<span class="eng"><span class="eq">●</span>${LV_SHORT[s.c]}</span>`:
  `<span class="eng">${LV_SHORT[s.c]} <span class="gap">→</span> <b>${LV_SHORT[s.d]}</b></span>`;}
const dnum=n=>n?(/^Д(\d+)/.test(n.d)?+n.d.slice(1):999):1e4;
const soon=n=>n&&dnum(n)<=PROJECT.status+3;
const nxCell=s=>s.nx?`<div class="nx ${soon(s.nx)?"soon":""}"><span class="dd">${esc(s.nx.d)}</span>${esc(s.nx.t)}</div>`:`<div class="nx none">—</div>`;
const ctCell=s=>{const c=s.ct||{};const L=[["✉",c.mail],["💬",c.tg],["☎",c.tel]].filter(x=>x[1]&&x[1]!=="—");
  return L.length?`<div class="ctl">${L.map(([i,v])=>`<div><span class="ci">${i}</span><span class="${/@|\+/.test(v)?"mono":""}">${esc(v)}</span></div>`).join("")}</div>`:`<span class="small" style="color:var(--ink-3)">—</span>`;};
const reqCell=s=>s.req?`<div class="req">${esc(s.req)}</div>`:"";
const crTags=s=>s.cr.map(c=>`<span class="tag cr">${c}</span>`).join("");

function sortRows(a){if(!st.sort)return a;const k=st.sort,d=st.dir;
  const val=s=>k==="rk"?RI[s.rk]:k==="nx"?dnum(s.nx):k==="strat"?["manage","satisfy","inform","monitor"].indexOf(strat(s)):k==="gap"?s.d-s.c:k==="name"?s.name:s[k];
  return[...a].sort((x,y)=>{const A=val(x),B=val(y);return(typeof A==="string"?A.localeCompare(B,"ru"):A-B)*d});}

function th(k,label){if(!k)return`<th>${label}</th>`;const on=st.sort===k;
  return`<th data-k="${k}" class="${on?"on":""}" aria-sort="${on?(st.dir>0?"ascending":"descending"):"none"}">${label}<span class="ar">${on?(st.dir>0?"▲":"▼"):"↕"}</span></th>`;}

function registry(){const rows=list();
  let h=`<div class="tw"><table><thead><tr>${th("id","ID")}${th("name","Стейкхолдер")}${th("rk","Роль")}${th(null,"Тип")}${th("p","Влияние")}${th("i","Интерес")}${th("strat","Стратегия: сейчас → нужно")}${th("gap","Вовлечённость: сейчас → цель")}${th(null,"Ответственный")}${th(null,"Контакты")}${th(null,"Ключевые требования")}</tr></thead><tbody>`;
  CATS.forEach((c,ci)=>{const g=sortRows(rows.filter(s=>s.cat===ci));if(!g.length)return;const cl=st.closed.has(ci);
    h+=`<tr class="grp ${cl?"closed":""}" data-g="${ci}"><td colspan="11"><span class="chev">▾</span>${esc(c)}<span class="cnt">${g.length}</span></td></tr>`;
    if(!cl)g.forEach(s=>{const flag=s.p>=4&&s.c<=2&&s.d>s.c;
      h+=`<tr class="row ${st.open===s.id?"cur":""}" data-id="${s.id}" tabindex="0">
      <td class="id mono">${s.id}</td>
      <td><div class="who-c">${ava(s)}<div><div class="nm">${esc(s.name)}${flag?`<span class="warn-dot" title="Высокое влияние, вовлечённость ниже цели">!</span>`:""}</div><div class="sub">${esc(s.role)}</div></div></div></td>
      <td>${rbadge(s)}</td>
      <td><div class="tags"><span class="tag">${s.in?"Внутр.":"Внешн."}</span>${s.dir?"":`<span class="tag ind">косвенный</span>`}</div></td>
      <td>${meter(s.p)}</td><td>${meter(s.i)}</td><td>${stratCell(s)}</td><td>${eng(s)}</td>
      <td class="small">${esc(s.own)}</td><td>${ctCell(s)}</td><td>${reqCell(s)}</td></tr>`;});});
  if(!rows.length)h+=`<tr><td colspan="11" class="small" style="padding:24px 8px">Никто не подходит под фильтры. Сбросьте поиск или категорию.</td></tr>`;
  return h+`</tbody></table></div>`;}

function matrix(){const rows=list(),fut=st.future;const cells={};
  rows.forEach(s=>{const m=fut&&s.fut;const p=m?s.fut.p:s.p,i=m?s.fut.i:s.i;(cells[p+"-"+i]=cells[p+"-"+i]||[]).push({s,m})});
  let g="";for(let p=5;p>=1;p--){g+=`<div class="yl">${p}</div>`;for(let i=1;i<=5;i++){const q=quad(p,i);
    const cls=["cell","q-"+q,p===5?"top":"",i===1?"left":"",i===4?"splitx":"",p===4?"splity":""].join(" ");
    const lab=(p===5&&i===5)||(p===5&&i===3)||(p===1&&i===5)||(p===1&&i===3)?STRAT[q]:"";
    g+=`<div class="${cls}">${(cells[p+"-"+i]||[]).map(({s,m})=>`<button type="button" class="chip ${m?"moved":""} ${st.open===s.id?"cur":""} sg-${sgap(s)}" data-id="${s.id}" title="${esc(s.name)} · ${RL[s.rk]}${sgap(s)!=="none"?" · сейчас: "+STRAT[asis(s)]:""}${m?" · прогноз: "+esc(s.fut.w):""}"><span class="mono">${s.id}</span>${esc(s.short)}${m?" ↗":""}</button>`).join("")}
      ${lab?`<span class="qlabel" style="color:var(--${q==="manage"?"crit":q==="satisfy"?"warn":q==="inform"?"accent":"ink-3"})">${lab}</span>`:""}</div>`;}}
  g+=`<div></div>`;for(let i=1;i<=5;i++)g+=`<div class="xl">${i}</div>`;
  const cnt=k=>rows.filter(s=>strat(s,fut)===k).length;
  return`<p class="note">Положение — оценки 1–5. Граница квадрантов проходит между 3 и 4: «высоким» считается 4 и 5. Стратегия по умолчанию следует из квадранта (сетка Power/Interest Менделоу), исключения отмечены в карточке.</p>
  <div class="mx-wrap"><div><div style="display:flex;gap:6px"><div class="axis-y" style="display:grid;place-items:center">Влияние ↑</div>
  <div class="mx-scroll" style="flex:1;min-width:0"><div class="mx">${g}</div></div></div>
  <div style="text-align:center;font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);margin-top:4px">Интерес →</div></div>
  <div class="side"><h3>По стратегиям</h3><div class="qlist">${["manage","satisfy","inform","monitor"].map(k=>`<div class="qrow">${pill(k)}<b>${cnt(k)}</b></div>`).join("")}</div>
  <h3>Динамика</h3><p>Стейкхолдеры смещаются по матрице. Включите «Прогноз: старт кампании» — пунктиром отмечены те, кто станет влиятельнее или заинтересованнее, когда холдинг запустит кампанию в Москве.</p>
  <p>${S.filter(s=>s.fut).map(s=>`<b>${esc(s.short)}</b>: ${s.p}/${s.i} → ${s.fut.p}/${s.fut.i}, ${esc(s.fut.w)}`).join("<br>")}</p></div></div>`;}

function engagement(){const rows=[...list()].sort((a,b)=>(b.d-b.c)-(a.d-a.c)||b.p-a.p);
  let h=`<p class="note">Матрица оценки вовлечённости: <b>Т</b> — текущее состояние, <b>Ц</b> — целевое. Отсортировано по величине разрыва, затем по влиянию. Не каждому нужен уровень «поддерживает»: для части внешних сторон цель — «нейтрален».</p>
  <div class="tw"><table class="seam"><thead><tr><th>ID</th><th>Стейкхолдер</th>${LEVELS.map(l=>`<th class="lv">${l}</th>`).join("")}<th>Стратегия</th></tr></thead><tbody>`;
  rows.forEach(s=>{h+=`<tr class="row ${st.open===s.id?"cur":""}" data-id="${s.id}" tabindex="0"><td class="id mono">${s.id}</td><td><div class="who-c">${ava(s)}<div><div class="nm">${esc(s.name)}</div><div class="sub">${RL[s.rk]} · влияние ${s.p} · интерес ${s.i}</div></div></div></td>`;
    const lo=Math.min(s.c,s.d),hi2=Math.max(s.c,s.d);
    for(let k=0;k<5;k++){let mk="",tr="";
      if(s.c!==s.d&&k>=lo&&k<=hi2){const l=k===lo?"50%":"0",r=k===hi2?"50%":"0";tr=`<span class="track" style="left:${l};right:${r}"></span>`;}
      if(k===s.c&&k===s.d)mk=`<span class="mark cd" title="Цель достигнута">Т·Ц</span>`;
      else if(k===s.c)mk=`<span class="mark c">Т</span>`;else if(k===s.d)mk=`<span class="mark d">Ц</span>`;
      h+=`<td class="lv">${tr}${mk}</td>`;}
    h+=`<td>${pill(strat(s))}</td></tr>`;});
  return h+`</tbody></table></div>`;}

function phases(){const rows=sortRows(list());
  let h=`<p class="note">Когда стейкхолдер активен по ходу проекта. Фазы и даты — по вехам устава, детальный график появится в Ганте. Проект на старте: идёт фаза 1.</p>
  <div class="tw"><table class="ph"><thead><tr><th>ID</th><th>Стейкхолдер</th>${PHASES.map(p=>`<th class="p ${p.state==="now"?"now":""}">${p.k}${p.state==="now"?" · сейчас":""}<small>${p.n}<br>${p.d}</small></th>`).join("")}<th>Ответственный</th></tr></thead><tbody>`;
  rows.forEach(s=>{h+=`<tr class="row ${st.open===s.id?"cur":""}" data-id="${s.id}" tabindex="0"><td class="id mono">${s.id}</td><td><div class="who-c">${ava(s)}<div><div class="nm">${esc(s.name)}</div><div class="sub">${RL[s.rk]} · ${esc(STRAT[strat(s)])}</div></div></div></td>`+
    s.ph.map((v,k)=>`<td class="p ${PHASES[k].state}"><div class="heat h${v}" title="${PHASES[k].k}: ${["не участвует","фоном","регулярно","ключевая роль"][v]}"></div></td>`).join("")+`<td class="small">${esc(s.own)}</td></tr>`;});
  return h+`</tbody></table></div>`;}

function legend(){const v=st.view;let h="";
  if(v==="registry"||v==="matrix")h+=["manage","satisfy","inform","monitor"].map(pill).join("");
  if(v==="registry")h+=`<span><span class="sxn red" style="margin:0">работаем слабее</span> / <span class="sxn amber" style="margin:0">тратим больше</span> стратегия «сейчас» не совпадает с квадрантом</span><span><span class="meter hi"><i class="f"></i><i class="f"></i></span> 4–5 — высокое</span><span><span class="warn-dot" style="margin:0">!</span> влияние ≥4, вовлечённость ниже цели</span><span><span class="role r-sponsor">Спонсор</span><span class="role r-customer">Заказчик</span><span class="role r-pm">РП</span> ключевые роли</span><span><span class="tag cr">CR-00X</span> связан с запросом на изменение</span><span><span class="nx soon"><span class="dd">Д43</span></span> точка в ближайшие 3 дня</span>`;
  if(v==="matrix")h+=`<span><span class="chip moved" style="pointer-events:none">SH-00 ↗</span> прогноз смещения</span><span><span class="chip sg-red" style="pointer-events:none">SH-00</span> работаем не по квадранту</span>`;
  if(v==="engagement")h+=`<span><span class="mark c">Т</span> текущее</span><span><span class="mark d">Ц</span> целевое</span><span><span class="mark cd">Т·Ц</span> цель достигнута</span><span><span style="display:inline-block;width:26px;height:2px;background:var(--warn)"></span> разрыв</span>`;
  if(v==="phases")h+=[0,1,2,3].map(k=>`<span><span class="heat h${k}" style="width:26px;height:14px;display:inline-block"></span>${["не участвует","фоном","регулярно","ключевая роль"][k]}</span>`).join("");
  h+=`<span class="fine">Оценки 1–5 · Д1, Д2… — рабочие дни проекта · клик по строке открывает карточку</span>`;
  $("#legend").innerHTML=h;}

function contact(s){const c=s.ct;if(!c)return"";
  const row=(l,v,mono)=>v&&v!=="—"?`<div class="mail"><span class="cl">${l}</span><span class="${mono?"mono":""}">${esc(v)}</span><button type="button" class="copy" data-copy="${esc(v)}">Копировать</button></div>`:"";
  return`<div class="sec"><h4>Контакты</h4><div class="ctc">${c.n?`<div><span class="who">${esc(c.n)}</span>${c.pos?` · <span class="small">${esc(c.pos)}</span>`:""}</div>`:""}
   ${row("Почта",c.mail,/@/.test(c.mail||""))}${row("Мессенджер",c.tg,true)}${row("Телефон",c.tel,true)}
   ${c.ch||c.tm?`<dl class="kv">${c.ch?`<dt>Предпочитает</dt><dd>${esc(c.ch)}</dd>`:""}${c.tm?`<dt>Когда удобно</dt><dd>${esc(c.tm)}</dd>`:""}</dl>`:""}
   <div class="fict">Учебный кейс: люди, адреса и номера вымышленные (домены .example, телефоны 555-01xx).</div></div></div>`;}
function card(){const s=S.find(x=>x.id===st.open);const c=$("#card"),sc=$("#scrim");
  if(!s){c.hidden=true;sc.hidden=true;return;}
  const k=strat(s),q=quad(s.p,s.i);
  c.innerHTML=`<div class="card-h">${ava(s,true)}<div class="t"><div class="eyebrow">${s.id} · ${esc(CATS[s.cat])}</div><h2>${esc(s.name)}</h2>
   <div class="tags">${rbadge(s)}${pill(k)}<span class="tag">${s.in?"Внутренний":"Внешний"}</span>${s.dir?`<span class="tag">прямой</span>`:`<span class="tag ind">косвенный</span>`}</div></div>
   <button type="button" class="x" id="close" aria-label="Закрыть">×</button></div>
  <div class="card-b">
   <dl class="kv"><dt>Роль на проекте</dt><dd>${RL[s.rk]}</dd><dt>Позиция</dt><dd>${esc(s.role)}</dd><dt>Влияние</dt><dd>${meter(s.p)}</dd><dt>Интерес</dt><dd>${meter(s.i)}</dd>
    <dt>Вовлечённость</dt><dd>${LEVELS[s.c]} → <b>${LEVELS[s.d]}</b>${s.c===s.d?` <span style="color:var(--ok)">· цель достигнута</span>`:""}</dd>
    <dt>Ответственный</dt><dd>${esc(s.own)}</dd>
    ${s.wbs.length?`<dt>Связь с ИСР</dt><dd><div class="tags">${s.wbs.map(w=>`<span class="tag mono">${w}</span>`).join("")}</div></dd>`:""}</dl>
   ${s.req?`<div class="sec"><h4>Ключевое требование</h4><div class="req big">${esc(s.req)}</div><p class="small" style="margin-top:6px">Без этого стейкхолдер не примет проект или не будет в нём участвовать.</p></div>`:""}<div class="sec"><h4>Интересы и ожидания</h4><p>${esc(s.want)}</p></div>
   ${s.mem?`<div class="sec"><h4>Состав совета</h4><dl class="kv">${s.mem.map(m=>`<dt>${esc(m[0])}</dt><dd>${esc(m[1])}<div class="small">${esc(m[2])}</div></dd>`).join("")}</dl>${s.memNote?`<p class="small" style="margin-top:6px">${esc(s.memNote)}</p>`:""}</div>`:""}
   ${contact(s)}
   ${sgap(s)!=="none"?`<div class="sec"><h4>Стратегия: сейчас → нужно</h4><p>Сейчас работаем как «${STRAT[asis(s)]}», по квадранту нужно «${STRAT[q]}».${s.acc?" Исключение принято: "+esc(s.acc):s.asisWhy?" "+esc(s.asisWhy):""}</p></div>`:""}
   ${s.risk?`<div class="risk"><b>Риск.</b> ${esc(s.risk)}</div>`:""}
   ${s.fut?`<div class="sec"><h4>Прогноз</h4><p>Влияние ${s.p} → ${s.fut.p}, интерес ${s.i} → ${s.fut.i}: ${esc(s.fut.w)}. Стратегия станет «${STRAT[strat(s,true)]}».</p></div>`:""}
   <div class="sec"><h4>Активность по фазам</h4><div class="mini-ph">${s.ph.map((v,k)=>`<div><div class="heat h${v}"></div>${PHASES[k].k}</div>`).join("")}</div></div>
   ${s.cr.length?`<div class="sec"><h4>Запросы на изменения</h4><div class="crl">${s.cr.map(id=>{const r=CR[id];return`<div class="cri"><div class="top"><span class="mono"><b>${id}</b> · ${r.d} · ${esc(r.by)}</span><span class="st st-${r.cls}">${r.st}</span></div>${esc(r.t)}<div class="small" style="margin-top:3px">${r.fx} · ${esc(r.who)}</div></div>`}).join("")}</div></div>`:""}
  </div>`;
  c.hidden=false;sc.hidden=false;$("#close").focus();}

function render(){
  document.querySelectorAll("#views button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===st.view));
  document.querySelectorAll("#side button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.s===st.side));
  $("#futwrap").hidden=st.view!=="matrix";
  $("#work").innerHTML=st.view==="matrix"?matrix():st.view==="engagement"?engagement():st.view==="phases"?phases():registry();
  legend();card();}

$("#role").innerHTML=`<option value="">Все роли</option>`+ROLES.map(r=>`<option value="${r[0]}">${r[1]}</option>`).join("");
$("#role").onchange=e=>{st.role=e.target.value;render();};
$("#cat").innerHTML=`<option value="-1">Все категории</option>`+CATS.map((c,i)=>`<option value="${i}">${c}</option>`).join("");
const VIEWS=["registry","matrix","engagement","phases"];
function fromHash(){const h=location.hash.slice(1);st.view=VIEWS.includes(h)?h:"registry";}
fromHash();facts();render();
addEventListener("hashchange",()=>{fromHash();render();});
$("#views").onclick=e=>{const b=e.target.closest("button");if(b){location.hash=b.dataset.v;}};
$("#side").onclick=e=>{const b=e.target.closest("button");if(b){st.side=b.dataset.s;render();}};
$("#q").oninput=e=>{st.q=e.target.value;render();};
$("#cat").onchange=e=>{st.cat=+e.target.value;render();};
$("#gaponly").onchange=e=>{st.gap=e.target.checked;render();};
$("#future").onchange=e=>{st.future=e.target.checked;render();};
$("#work").addEventListener("click",e=>{
  const t=e.target.closest("th[data-k]");if(t){const k=t.dataset.k;if(st.sort===k)st.dir=-st.dir;else{st.sort=k;st.dir=(k==="p"||k==="i"||k==="gap")?-1:1;}render();return;}
  const g=e.target.closest("tr.grp");if(g){const i=+g.dataset.g;st.closed.has(i)?st.closed.delete(i):st.closed.add(i);
    try{localStorage.setItem("km-sr-closed",JSON.stringify([...st.closed]))}catch(_){}render();return;}
  const r=e.target.closest("[data-id]");if(r){st.open=r.dataset.id;render();}});
$("#work").addEventListener("keydown",e=>{if(e.key==="Enter"){const r=e.target.closest("tr.row");if(r){st.open=r.dataset.id;render();}}});
function closeCard(){const id=st.open;st.open=null;render();const r=document.querySelector(`[data-id="${id}"]`);if(r)r.focus();}
$("#scrim").onclick=closeCard;
$("#card").addEventListener("click",e=>{if(e.target.id==="close")closeCard();const b=e.target.closest(".copy");if(b){const t=b.dataset.copy;const done=()=>{b.textContent="Скопировано";setTimeout(()=>b.textContent="Копировать",1500)};try{navigator.clipboard.writeText(t).then(done,()=>sel(b))}catch(_){sel(b)}}});
function sel(b){const r=document.createRange();r.selectNodeContents(b.previousElementSibling);const g=getSelection();g.removeAllRanges();g.addRange(r);}
addEventListener("keydown",e=>{if(e.key==="Escape"&&st.open)closeCard();});
</script>
</body>
</html>
